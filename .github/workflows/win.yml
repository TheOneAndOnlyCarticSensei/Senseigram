name: Windows Build

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Enable Long Paths in Git
        run: git config --system core.longpaths true

      - name: Free up server disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\ProgramData\chocolatey" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Go" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Move to D Drive Fast
        shell: cmd
        run: |
          mkdir D:\TBuild\Senseigram
          robocopy "%GITHUB_WORKSPACE%" "D:\TBuild\Senseigram" /E /R:0 /W:0 /MT:8 /XJD /NJH /NJS
          if %ERRORLEVEL% LSS 8 exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Senseigram
        shell: cmd
        working-directory: D:\TBuild\Senseigram
        run: |
          python build/win.py --force-git

      - name: Save Artifact
        shell: cmd
        run: |
          mkdir D:\Artifact
          copy D:\TBuild\Senseigram\out\Release\Senseigram.exe D:\Artifact\ || copy D:\TBuild\Senseigram\out\Release\Telegram.exe D:\Artifact\Senseigram.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senseigram-Executable
          path: D:\Artifact\Senseigram.exe
