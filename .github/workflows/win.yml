name: Windows.

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: "2022"
      Platform: "x64"
      VSCMD_ARG_TGT_ARCH: "x64"
      PreferredToolArchitecture: "x64"
      _CL_: "/Zm2000"

    steps:
      - name: Add 32GB Virtual RAM (Pagefile) on D drive
        shell: cmd
        run: |
          wmic computersystem where name="%computername%" set AutomaticManagedPagefile=False || ver > nul
          wmic pagefileset create name="D:\\pagefile.sys" || ver > nul
          wmic pagefileset where name="D:\\pagefile.sys" set InitialSize=16384,MaximumSize=32768 || ver > nul

      - name: Free up server disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Go" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue

      - name: Prepare directories.
        shell: cmd
        run: |
          mkdir D:\TBuild
          mkdir D:\TBuild\Libraries
          mkdir D:\TBuild\ThirdParty
          mklink /J "%USERPROFILE%\TBuild" "D:\TBuild"

      - name: Get repository name.
        shell: bash
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Move repo to TBuild.
        shell: cmd
        run: |
          move "${{ env.REPO_NAME }}" "D:\TBuild\${{ env.REPO_NAME }}"

      - name: Fix ICO files to valid Windows 3.00 format
        shell: pwsh
        working-directory: D:\TBuild\${{ env.REPO_NAME }}\Telegram\Resources
        run: |
          Add-Type -AssemblyName System.Drawing
          $icoFiles = Get-ChildItem -Path . -Filter "*.ico" -Recurse
          foreach ($file in $icoFiles) {
            try {
              $img = [System.Drawing.Image]::FromFile($file.FullName)
              $bmp = New-Object System.Drawing.Bitmap($img, 32, 32)
              $img.Dispose()
              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Bmp)
              $bmpBytes = $ms.ToArray()
              $ms.Dispose()
              $bmp.Dispose()
              # Strip 14-byte BITMAPFILEHEADER and double biHeight for ICO XOR+AND mask
              $dibSize = $bmpBytes.Length - 14
              $andMaskSize = 4 * 32 # 32 rows * 4 bytes stride
              $totalDataSize = $dibSize + $andMaskSize
              $fs = [System.IO.File]::Open($file.FullName, [System.IO.FileMode]::Create)
              $bw = New-Object System.IO.BinaryWriter($fs)
              # ICONDIR (6 bytes): Reserved=0, Type=1 (ICO), Count=1
              $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]1)
              # ICONDIRENTRY (16 bytes): 32x32, 0 colors, 0 reserved, 1 plane, 32 bpp
              $bw.Write([byte]32); $bw.Write([byte]32); $bw.Write([byte]0); $bw.Write([byte]0)
              $bw.Write([uint16]1); $bw.Write([uint16]32)
              $bw.Write([uint32]$totalDataSize); $bw.Write([uint32]22)
              # Write BITMAPINFOHEADER with height = 64 (32*2)
              [BitConverter]::GetBytes([int32]64).CopyTo($bmpBytes, 14 + 8)
              $bw.Write($bmpBytes, 14, $dibSize)
              $bw.Write((New-Object byte[] $andMaskSize))
              $bw.Close(); $fs.Close()
              Write-Host "Fixed ICO 3.00 format: $($file.FullName)"
            } catch {
              Write-Host "Skipping or already valid: $($file.FullName)"
            }
          }

      - name: Restore Cached Libraries
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            D:\TBuild\Libraries
          key: tbuild-libs-win64-v3

      - name: First set up.
        shell: cmd
        working-directory: D:\TBuild
        run: |
          echo D:\TBuild\ThirdParty\Ninja>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\jom>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\cmake\bin>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\Git\cmd>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\yasm>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\Python39>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\Python39\Scripts>> %GITHUB_PATH%
          echo D:\TBuild\ThirdParty\NuGet>> %GITHUB_PATH%

      - name: Native Tools Command Prompt (64-bit).
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: NuGet sources.
        shell: cmd
        run: |
          nuget sources Remove -Name "Microsoft Visual Studio Offline Packages" || ver > nul

      - name: Libraries.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: D:\TBuild\${{ env.REPO_NAME }}\Telegram\build\prepare
        run: |
          win.bat

      - name: Save Libraries Cache Always
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            D:\TBuild\Libraries
          key: tbuild-libs-win64-v3

      - name: Telegram Desktop build.
        shell: pwsh
        working-directory: D:\TBuild\${{ env.REPO_NAME }}\Telegram
        run: |
          $qtConfig = Get-ChildItem -Path "D:\TBuild\Libraries" -Filter "Qt6Config.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qtConfig) {
            $qtDir = $qtConfig.DirectoryName -replace '\\', '/'
            $qtRoot = $qtConfig.Directory.Parent.Parent.FullName -replace '\\', '/'
            Write-Host "Found Qt6 at: $qtDir"
            $env:CMAKE_PREFIX_PATH = "$qtRoot;D:/TBuild/Libraries/win64"
            $env:Qt6_DIR = $qtDir
          }
          cmd /c "configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D DESKTOP_APP_USE_PACKAGED=OFF -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF -D Qt6_DIR=`"$qtDir`""
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retrying configure.bat without x64 arg..."
            cmd /c "configure.bat -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D DESKTOP_APP_USE_PACKAGED=OFF -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF -D Qt6_DIR=`"$qtDir`" -A x64"
          }
          cmake --build ../out --config Release -- /m:2 /p:CL_MPCount=2 /p:PreferredToolArchitecture=x64
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Finishing remaining files in low-memory single-process mode..."
            cmake --build ../out --config Release -- /m:1 /p:CL_MPCount=1 /p:PreferredToolArchitecture=x64
          }

      - name: Move artifact.
        shell: pwsh
        working-directory: D:\TBuild\${{ env.REPO_NAME }}\out\Release
        run: |
          New-Item -ItemType Directory -Force -Path "D:\Artifact" | Out-Null
          $exe = Get-ChildItem -Path "D:\TBuild\${{ env.REPO_NAME }}\out\Release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if ($exe) {
            Write-Host "Found compiled binary: $($exe.FullName)"
            Copy-Item $exe.FullName "D:\Artifact\Senseigram.exe" -Force
          } else {
            Write-Error "No .exe found in Release directory!"
            exit 1
          }

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: Senseigram-Windows-x64
          path: D:\Artifact\Senseigram.exe
